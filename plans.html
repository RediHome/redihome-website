  <style>
    html,body{height:100%;margin:0}
    body{background:#F1ECE0;color:#211D18;font-family:'Archivo',sans-serif;
      display:flex;align-items:center;justify-content:center;text-align:center}
    .brand{font-family:'Fraunces',serif;font-weight:600;font-size:1.8rem;letter-spacing:-.02em}
    .brand b{color:#AF4329}
    p{color:#4A443B;margin:14px 0 18px}
    a{color:#AF4329;font-weight:500;text-decoration:none}
    .dot{width:10px;height:10px;border-radius:50%;background:#AF4329;display:inline-block;
      margin:0 3px;animation:pulse 1s infinite alternate}

    @keyframes pulse{from{opacity:.25}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
